<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schema Lens</title>
  <link rel="stylesheet" href="panel.css">
  <script type="module" src="panel.js"></script>
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="i-unfold" viewBox="0 0 24 24"><path d="m8 9 4-4 4 4M8 15l4 4 4-4"/></symbol>
    <symbol id="i-fold" viewBox="0 0 24 24"><path d="m8 5 4 4 4-4M8 19l4-4 4 4"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5M16 7l5 5-5 5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></symbol>
    <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
  </svg>

  <header class="bar">
    <label class="search">
      <svg class="icon"><use href="#i-search"/></svg>
      <input id="q" type="search" placeholder="Search keys and values" autocomplete="off" spellcheck="false" aria-label="Search structured data">
      <span id="hits" class="hits" aria-live="polite"></span>
    </label>
    <div class="tools">
      <button id="btn-toggle" class="tool" type="button" title="Expand all" aria-label="Expand all" disabled><svg class="icon"><use href="#i-unfold"/></svg></button>
      <button id="btn-copy" class="tool" type="button" title="Copy all as JSON" aria-label="Copy all as JSON" disabled><svg class="icon"><use href="#i-copy"/></svg></button>
      <button id="btn-download" class="tool" type="button" title="Download as .json" aria-label="Download as .json" disabled><svg class="icon"><use href="#i-download"/></svg></button>
      <button id="btn-refresh" class="tool" type="button" title="Read the page again" aria-label="Read the page again"><svg class="icon"><use href="#i-refresh"/></svg></button>
      <button id="btn-sidebar" class="tool" type="button" title="Keep open in the sidebar" aria-label="Keep open in the sidebar" hidden><svg class="icon"><use href="#i-sidebar"/></svg></button>
    </div>
  </header>

  <div id="summary" class="summary" hidden></div>

  <main id="list" class="list" aria-busy="true">
    <div class="state"><p>Reading page…</p></div>
  </main>

  <footer id="foot" class="foot" hidden>
    <span class="foot-label">Validate this page</span>
    <a id="link-rrt" target="_blank" rel="noopener noreferrer">Rich Results Test</a>
    <a id="link-sov" target="_blank" rel="noopener noreferrer">Schema.org validator</a>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
